/* ──────────────────────────────────────────────────────────────────────────
   NAI Character Batch Runner — single file MVP
   설계 문서: NAI_Character_Batch_Runner_설계도_보고서.pdf
   ────────────────────────────────────────────────────────────────────────── */

const { useState, useEffect, useMemo, useCallback, useRef, useSyncExternalStore } = React;

/* ============ Utils ============ */
const uid = (p='id') => `${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const nowIso = () => new Date().toISOString();
const pad = (n, l=3) => String(n).padStart(l, '0');
const sanitizeFs = (s) => (s||'').replace(/[\\/:*?"<>|]+/g, '_').replace(/\s+/g, '_').slice(0, 80) || 'unnamed';
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const fmtDate = (iso) => { try { return new Date(iso).toLocaleString(); } catch { return iso; } };
const clone = (v) => JSON.parse(JSON.stringify(v));
const randSeed = () => Math.floor(Math.random() * 2**32);

/* NAIS weight syntax (N::content::) → NovelAI ({{{content}}} / [[content]]) */
function naisToNovelAi(text) {
  if (!text) return text;
  return String(text).replace(/(-?\d+)::(.+?)::/g, (_, n, body) => {
    const num = parseInt(n, 10) | 0;
    if (num > 0) return '{'.repeat(num) + body + '}'.repeat(num);
    if (num < 0) return '['.repeat(-num) + body + ']'.repeat(-num);
    return body;
  });
}
function downloadBlob(filename, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function pickJsonFile() {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'application/json,.json';
    input.onchange = () => resolve(input.files?.[0] || null);
    input.click();
  });
}
function pickImageFiles(multiple=true) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.multiple = multiple;
    input.onchange = () => resolve(Array.from(input.files || []));
    input.click();
  });
}
async function blobToBase64(blob) {
  const buf = await blob.arrayBuffer();
  const bytes = new Uint8Array(buf);
  let bin = '';
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(bin);
}

/* ============ IndexedDB ============ */
const DB_NAME = 'nai-batch-runner';
const DB_VERSION = 2;
const STORES = ['characters', 'promptSets', 'sessions', 'jobs', 'kv', 'images'];

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      STORES.forEach(name => {
        if (!db.objectStoreNames.contains(name)) {
          const s = db.createObjectStore(name, { keyPath: name === 'kv' ? 'key' : 'id' });
          if (name === 'jobs' || name === 'images') s.createIndex('sessionId', 'sessionId', { unique: false });
        }
      });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idb(store, mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, mode);
    const s = tx.objectStore(store);
    const result = fn(s);
    tx.oncomplete = () => resolve(result instanceof IDBRequest ? result.result : result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

const db = {
  getAll: (store) => idb(store, 'readonly', s => {
    return new Promise((res, rej) => {
      const r = s.getAll();
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }).then(r => r),
  get: (store, key) => idb(store, 'readonly', s => {
    return new Promise((res, rej) => {
      const r = s.get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }).then(r => r),
  put: (store, value) => idb(store, 'readwrite', s => s.put(value)),
  delete: (store, key) => idb(store, 'readwrite', s => s.delete(key)),
  clear: (store) => idb(store, 'readwrite', s => s.clear()),
  bulkPut: (store, values) => idb(store, 'readwrite', s => { values.forEach(v => s.put(v)); }),
  jobsBySession: (sessionId) => idb('jobs', 'readonly', s => {
    return new Promise((res, rej) => {
      const r = s.index('sessionId').getAll(IDBKeyRange.only(sessionId));
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }).then(r => r),
};

/* ============ KV (settings, dir handle) ============ */
async function kvGet(key, defaultValue) {
  const v = await db.get('kv', key);
  return v ? v.value : defaultValue;
}
async function kvSet(key, value) {

/* ============ Settings (localStorage for non-secret prefs; token also in localStorage with mask) ============ */
const DEFAULT_SETTINGS = {
  apiToken: '',
  delayBetweenJobsMs: 1500,
  maxRetry: 2,
  apiBase: 'https://image.novelai.net',
};
function isProxyMode() {
  return /^https?:\/\/(localhost|127\.|\[::1\])/.test(window.location.origin);
}
function loadSettings() {
  let s;
  try {
    const raw = localStorage.getItem('nai-settings');
    s = raw ? { ...DEFAULT_SETTINGS, ...JSON.parse(raw) } : { ...DEFAULT_SETTINGS };
  } catch { s = { ...DEFAULT_SETTINGS }; }
  if (isProxyMode()) s.apiBase = window.location.origin;
  return s;
}
function saveSettings(s) {
  localStorage.setItem('nai-settings', JSON.stringify(s));
}
function maskToken(t) {
  if (!t) return '';
  if (t.length <= 10) return '••••';
  return `${t.slice(0,4)}••••••••${t.slice(-4)}`;
}

/* ============ NAIS Preset import/export ============
   NAIS 포맷:
   { id, name, scenes: [{ id, name, scenePrompt, width?, height?, ... }], createdAt }
   내부 PromptSet 포맷:
   { id, name, description?, prompts: [{ id, order, title, prompt, negativePrompt?, enabled, width?, height? }], createdAt, updatedAt }
*/
function naisPresetToPromptSet(nais) {
  if (!nais || typeof nais !== 'object') throw new Error('JSON 형식이 올바르지 않습니다.');
  const scenes = Array.isArray(nais.scenes) ? nais.scenes : null;
  if (!scenes) throw new Error('NAIS preset JSON에 scenes 배열이 없습니다.');
  const now = nowIso();
  return {
    id: uid('pset'),
    name: String(nais.name || 'Imported preset').trim() || 'Imported preset',
    description: nais.id ? `NAIS preset id ${nais.id} 에서 가져옴` : 'NAIS preset 에서 가져옴',
    prompts: scenes.map((sc, i) => ({
      id: uid('slot'),
      order: i + 1,
      title: String(sc.name ?? `slot_${i+1}`).trim() || `slot_${i+1}`,
      prompt: String(sc.scenePrompt || '').trim(),
      negativePrompt: sc.negativePrompt ? String(sc.negativePrompt) : undefined,
      enabled: sc.enabled !== false,
      width: Number.isFinite(sc.width) ? sc.width : undefined,
      height: Number.isFinite(sc.height) ? sc.height : undefined,
    })),
    createdAt: now,
    updatedAt: now,
  };
}
function promptSetToNaisPreset(set) {
  const ts = Date.now();
  return {
    id: String(ts),
    name: set.name,
    scenes: set.prompts.map((s, i) => {
      const scene = {
        id: String(ts + i),
        name: s.title,
        scenePrompt: s.prompt,
        queueCount: 0,
        images: [],
        createdAt: ts + i,
      };
      if (s.negativePrompt) scene.negativePrompt = s.negativePrompt;
      if (s.enabled === false) scene.enabled = false;
      if (s.width) scene.width = s.width;
      if (s.height) scene.height = s.height;
      return scene;
    }),
    createdAt: ts,
  };
}

/* ============ Models / Defaults ============ */
const MODELS = [
  { id: 'nai-diffusion-4-5-full', label: 'NAI Diffusion v4.5 Full' },
  { id: 'nai-diffusion-4-full', label: 'NAI Diffusion v4 Full' },
  { id: 'nai-diffusion-4-curated-preview', label: 'NAI Diffusion v4 Curated' },
  { id: 'nai-diffusion-3', label: 'NAI Diffusion v3' },
];
const SAMPLERS = ['k_euler', 'k_euler_ancestral', 'k_dpmpp_2s_ancestral', 'k_dpmpp_2m', 'k_dpmpp_sde', 'ddim'];
const RESOLUTIONS = [
  { label: 'Portrait 832×1216', w: 832, h: 1216 },
  { label: 'Landscape 1216×832', w: 1216, h: 832 },
  { label: 'Square 1024×1024', w: 1024, h: 1024 },
  { label: 'Tall 1024×1536', w: 1024, h: 1536 },
  { label: 'Wide 1536×1024', w: 1536, h: 1024 },
];
/* NAI 기본 Quality Tags / UC Preset (모델별로 NovelAI UI 가 자동 부가하는 텍스트) */
const QUALITY_PRESETS = {
  'nai-diffusion-4-5-full': 'rating:general, best quality, very aesthetic, absurdres',
  'nai-diffusion-4-full':   'rating:general, best quality, very aesthetic, absurdres',
  'nai-diffusion-4-curated-preview': 'rating:general, best quality, very aesthetic, absurdres',
  'nai-diffusion-3':        'best quality, amazing quality, very aesthetic, absurdres',
};
const UC_PRESETS = {
  none:  '',
  light: 'lowres, jpeg artifacts, worst quality, watermark, blurry, very displeasing',
  heavy: 'blurry, lowres, error, film grain, scan artifacts, worst quality, bad quality, jpeg artifacts, very displeasing, chromatic aberration, halftone, multiple views, logo, too many watermarks, negative space, blank page',
  human: 'blurry, lowres, error, film grain, scan artifacts, worst quality, bad quality, jpeg artifacts, very displeasing, chromatic aberration, halftone, multiple views, logo, too many watermarks, negative space, blank page, @_@, mismatched pupils, glowing eyes, bad anatomy',
};
const UC_PRESET_LABELS = { none: '없음', light: 'Light', heavy: 'Heavy', human: 'Human Focus' };

const DEFAULT_PRESET = {
  model: 'nai-diffusion-4-5-full',
  width: 832,
  height: 1216,
  steps: 28,
  cfgScale: 5.0,
  sampler: 'k_euler',
  smea: false,
  smeaDyn: false,
};

const DEFAULT_BATCH = {
  prompt: '',
  negativePrompt: '',
  qualityTagsEnabled: true,
  ucLevel: 'heavy', // 'none' | 'light' | 'heavy' | 'human'
};

/* ============ Tiny event bus / store ============ */
function createStore(initial) {
  let state = initial;
  const listeners = new Set();
  return {
    get: () => state,
    set: (patch) => { state = typeof patch === 'function' ? patch(state) : { ...state, ...patch }; listeners.forEach(l => l()); },
    subscribe: (l) => { listeners.add(l); return () => listeners.delete(l); },
  };
}
function useStore(store) {
  return useSyncExternalStore(store.subscribe, store.get, store.get);
}

/* Runner store: live queue control + progress */
const runner = createStore({
  isRunning: false,
  isPaused: false,
  isCancelling: false,
  sessionId: null,
  current: null, // { jobId, characterName, promptTitle, index, total }
  logs: [],      // { ts, level, msg }
  anlas: { balance: null, sessionStart: null }, // balance: 현재 잔량, sessionStart: 세션 시작 시 잔량
});
function rlog(level, msg) {
  runner.set(s => ({ ...s, logs: [...s.logs.slice(-499), { ts: nowIso(), level, msg }] }));
  // eslint-disable-next-line no-console
  if (level === 'error') console.error('[runner]', msg);
}

/* ============ Prompt composition ============
   순서: [Quality 프리셋?] + [배치 공통 Prompt] + [Character.basePrompt] + [Slot.prompt]
   네거티브: [UC 프리셋?] + [배치 공통 Undesired] + [Slot.negativePrompt OR Character.negativePrompt]
*/
function composePrompt(character, slot, batch, preset) {
  const parts = [];
  if (batch?.qualityTagsEnabled) {
    const q = QUALITY_PRESETS[preset?.model] || QUALITY_PRESETS['nai-diffusion-4-5-full'];
    if (q) parts.push(q);
  }
  if (batch?.prompt?.trim()) parts.push(batch.prompt.trim());
  if (character.basePrompt?.trim()) parts.push(character.basePrompt.trim());
  if (slot.prompt?.trim()) parts.push(slot.prompt.trim());
  return naisToNovelAi(parts.filter(Boolean).join(', '));
}
function composeNegativePrompt(character, slot, batch) {
  const parts = [];
  const ucLevel = batch?.ucLevel || 'none';
  const uc = UC_PRESETS[ucLevel] || '';
  if (uc) parts.push(uc);
  if (batch?.negativePrompt?.trim()) parts.push(batch.negativePrompt.trim());
  if (slot.negativePrompt?.trim()) parts.push(slot.negativePrompt.trim());
  else if (character.negativePrompt?.trim()) parts.push(character.negativePrompt.trim());
  return naisToNovelAi(parts.filter(Boolean).join(', '));
}

/* ============ Seed policy ============ */
function resolveSeed(character, jobIndexInCharacter, perCharSeedCache) {
  const mode = character.defaultSeedMode || 'random';
  if (mode === 'fixed_per_job') return character.fixedSeed ?? randSeed();
  if (mode === 'fixed_per_character') {
    if (perCharSeedCache.has(character.id)) return perCharSeedCache.get(character.id);
    const seed = character.fixedSeed ?? randSeed();
    perCharSeedCache.set(character.id, seed);
    return seed;
  }
  return randSeed();
}

/* ============ Queue build ============ */
function buildQueue({ characters, promptSet, sessionId, batch, preset }) {
  const jobs = [];
  let order = 1;
  for (const character of characters) {
    for (const slot of promptSet.prompts) {
      if (!slot.enabled) continue;
      jobs.push({
        id: uid('job'),
        sessionId,
        characterId: character.id,
        characterName: character.name,
        promptSlotId: slot.id,
        promptTitle: slot.title,
        order,
        finalPrompt: composePrompt(character, slot, batch, preset),
        finalNegativePrompt: composeNegativePrompt(character, slot, batch),
        width: slot.width || undefined,
        height: slot.height || undefined,
        status: 'pending',
        retryCount: 0,
        createdAt: nowIso(),
      });
      order += 1;
    }
  }
  return jobs;
}

/* ============ NovelAI API ============ */
function buildPayload({ job, preset, seed, refs }) {
  const width = job.width || preset.width;
  const height = job.height || preset.height;
  const isV4 = /^nai-diffusion-4/.test(preset.model);

  const refParams = {};
  if (refs && refs.length) {
    refParams.reference_image_multiple = refs.map(r => r.base64);
    refParams.reference_strength_multiple = refs.map(r => Number(r.strength ?? 0.6));
    refParams.reference_information_extracted_multiple = refs.map(r => Number(r.fidelity ?? 1.0));
  }

  const params = {
    params_version: 3,
    width,
    height,
    ...refParams,
    scale: preset.cfgScale,
    sampler: preset.sampler,
    steps: preset.steps,
    n_samples: 1,
    ucPreset: 0,
    qualityToggle: true,
    dynamic_thresholding: false,
    controlnet_strength: 1,
    legacy: false,
    add_original_image: false,
    uncond_scale: 1,
    cfg_rescale: 0,
    noise_schedule: 'karras',
    negative_prompt: job.finalNegativePrompt,
    seed,
  };

  if (isV4) {
    params.v4_prompt = {
      caption: { base_caption: job.finalPrompt, char_captions: [] },
      use_coords: false,
      use_order: true,
    };
    params.v4_negative_prompt = {
      caption: { base_caption: job.finalNegativePrompt, char_captions: [] },
      legacy_uc: false,
    };
    params.characterPrompts = [];
    params.use_coords = false;
    params.legacy_v3_extend = false;
    params.skip_cfg_above_sigma = null;
    params.autoSmea = !!preset.smea;
  } else {
    params.sm = !!preset.smea;
    params.sm_dyn = !!preset.smeaDyn;
  }

  return {
    input: job.finalPrompt,
    model: preset.model,
    action: 'generate',
    parameters: params,
  };
}

async function novelaiValidateToken(apiBase, token) {
  // GET /user/information
  const url = `${apiBase.replace(/\/$/,'')}/user/information`.replace('image.novelai.net','api.novelai.net');
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (res.ok) return { ok: true };
  let body = '';
  try { body = (await res.text()).slice(0, 200); } catch {}
  return { ok: false, status: res.status, body };
}

async function novelaiGetSubscription(apiBase, token) {
  // GET /user/subscription → Anlas 잔량
  const url = `${apiBase.replace(/\/$/,'')}/user/subscription`.replace('image.novelai.net','api.novelai.net');
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) {
    let body = '';
    try { body = await res.text(); } catch {}
    throw new Error(`subscription ${res.status}: ${body.slice(0,200)}`);
  }
  const j = await res.json();
  const left = j.trainingStepsLeft || {};
  const fixed = Number(left.fixedTrainingStepsLeft) || 0;
  const paid = Number(left.purchasedTrainingSteps) || 0;
  return { fixed, paid, total: fixed + paid };
}

async function novelaiGenerate(apiBase, token, payload, signal) {
  const url = `${apiBase.replace(/\/$/,'')}/ai/generate-image`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${token}`,
    },
    body: JSON.stringify(payload),
    signal,
  });
  if (!res.ok) {
    let body = '';
    try { body = await res.text(); } catch {}
    const err = new Error(`NovelAI ${res.status}: ${body.slice(0,300)}`);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  const buf = await res.arrayBuffer();
  const zip = await JSZip.loadAsync(buf);
  const pngEntry = Object.values(zip.files).find(f => /\.png$/i.test(f.name));
  if (!pngEntry) throw new Error('응답 ZIP에 PNG 파일이 없습니다.');
  const blob = await pngEntry.async('blob');
  return new Blob([blob], { type: 'image/png' });
}

/* ============ Image storage (IndexedDB) ============ */
async function saveImageBlob({ sessionId, job, blob }) {

}
async function getImageBlob(jobId) {

async function deleteImagesBySession(sessionId) {
  const all = await db.getAll('images');
  for (const r of all) if (r.sessionId === sessionId) await db.delete('images', r.id);
}


/* ============ Runner ============ */
async function startRun({ session, jobs, preset, settings }) {
  runner.set({ isRunning: true, isPaused: false, isCancelling: false, sessionId: session.id, current: null, logs: [], anlas: { balance: null, sessionStart: null } });
  rlog('info', `세션 시작: ${session.name} (jobs=${jobs.length})`);

  try {
    const a = await novelaiGetSubscription(settings.apiBase, settings.apiToken);
    runner.set(s => ({ ...s, anlas: { balance: a.total, sessionStart: a.total } }));
    rlog('info', `Anlas 시작 잔량: ${a.total.toLocaleString()}`);
  } catch (e) {
    rlog('warn', `Anlas 조회 실패: ${e.message||e}`);
  }

  const perCharSeed = new Map();
  // restore per-character seeds from already-running session if reload
  const characters = await db.getAll('characters');
  const charById = new Map(characters.map(c => [c.id, c]));
  // PR reference cache: characterId → refs array (raw base64, no encoding)
  const refCache = new Map();
  async function getRefsFor(character) {
    if (refCache.has(character.id)) return refCache.get(character.id);
    const raw = (character.referenceImages || []).filter(r => r.enabled !== false && r.blob);
    if (!raw.length) { refCache.set(character.id, []); return []; }
    const out = await Promise.all(raw.map(async (r) => ({
      base64: await blobToBase64(r.blob),
      strength: Number.isFinite(r.strength) ? r.strength : 0.6,
      fidelity: Number.isFinite(r.fidelity) ? r.fidelity : 1.0,
      mode: r.mode || 'character',
    })));
    refCache.set(character.id, out);
    return out;
  }

  // mark all jobs queued
  for (let i = 0; i < jobs.length; i++) {
    if (runner.get().isCancelling) break;
    while (runner.get().isPaused) {
      await sleep(400);
      if (runner.get().isCancelling) break;
    }
    if (runner.get().isCancelling) break;

    let job = jobs[i];
    if (job.status === 'success' || job.status === 'skipped') continue;
    const character = charById.get(job.characterId);
    if (!character) {
      job = { ...job, status: 'failed', errorMessage: '캐릭터를 찾을 수 없음', completedAt: nowIso() };
      jobs[i] = job;
      await db.put('jobs', job);
      rlog('error', `#${job.order} 캐릭터 누락 → failed`);
      continue;
    }

    const seed = job.seed ?? resolveSeed(character, i, perCharSeed);
    runner.set(s => ({ ...s, current: { jobId: job.id, characterName: job.characterName, promptTitle: job.promptTitle, index: i+1, total: jobs.length } }));

    job = { ...job, status: 'running', startedAt: nowIso(), seed };
    jobs[i] = job;
    await db.put('jobs', job);
    rlog('info', `#${pad(job.order)} ${job.characterName} / ${job.promptTitle} 시작 (seed=${seed})`);

    try {
      const refs = await getRefsFor(character);
      const payload = buildPayload({ job, preset, seed, refs });
      if (refs.length) rlog('info', `#${pad(job.order)} PR refs ${refs.length}장 적용 (strength avg ${(refs.reduce((a,b)=>a+b.strength,0)/refs.length).toFixed(2)})`);
      const blob = await novelaiGenerate(settings.apiBase, settings.apiToken, payload);
      await saveImageBlob({ sessionId: session.id, job, blob });
      job = { ...job, status: 'success', completedAt: nowIso(), errorMessage: undefined };
      jobs[i] = job;
      await db.put('jobs', job);
      rlog('info', `#${pad(job.order)} success`);
      novelaiGetSubscription(settings.apiBase, settings.apiToken)
        .then(a => runner.set(s => ({ ...s, anlas: { ...s.anlas, balance: a.total } })))
        .catch(()=>{});
    } catch (err) {
      const isAuth = err.status === 401 || err.status === 403;
      if (isAuth) {
        job = { ...job, status: 'failed', completedAt: nowIso(), errorMessage: `인증 실패(${err.status}) — 토큰을 확인하세요.` };
        jobs[i] = job;
        await db.put('jobs', job);
        rlog('error', `#${pad(job.order)} 인증 실패: 즉시 중단`);
        runner.set(s => ({ ...s, isCancelling: true }));
        break;
      }
      if (job.retryCount < settings.maxRetry) {
        job = { ...job, status: 'pending', retryCount: job.retryCount + 1, errorMessage: String(err.message||err) };
        jobs[i] = job;
        await db.put('jobs', job);
        rlog('warn', `#${pad(job.order)} 오류, 재시도 예정 (${job.retryCount}/${settings.maxRetry}): ${err.message||err}`);
        i -= 1; // retry same index
        await sleep(Math.max(1000, settings.delayBetweenJobsMs * 2));
        continue;
      } else {
        job = { ...job, status: 'failed', completedAt: nowIso(), errorMessage: String(err.message||err) };
        jobs[i] = job;
        await db.put('jobs', job);
        rlog('error', `#${pad(job.order)} 실패: ${err.message||err}`);
      }
    }
    await sleep(settings.delayBetweenJobsMs);
  }

  // Mark remaining pending as cancelled if cancelling
  if (runner.get().isCancelling) {
    for (let i = 0; i < jobs.length; i++) {
      if (jobs[i].status === 'pending' || jobs[i].status === 'running') {
        const j = { ...jobs[i], status: 'cancelled', completedAt: nowIso() };
        jobs[i] = j;
        await db.put('jobs', j);
      }
    }
    rlog('warn', '세션 중단됨 — 남은 작업 cancelled 처리');
  }

  session.completedAt = nowIso();
  await db.put('sessions', session);

  runner.set({ isRunning: false, isPaused: false, isCancelling: false, sessionId: session.id, current: null, logs: runner.get().logs });
  rlog('info', `세션 종료: ${session.name}`);
}

function Badge({ status }) {
  const map = {
    pending: 'badge badge-pending', running: 'badge badge-running', success: 'badge badge-success',
    failed: 'badge badge-failed', skipped: 'badge badge-skipped', cancelled: 'badge badge-cancelled',
  };
  return <span className={map[status]||'badge badge-pending'}>{status}</span>;
}

function ConfirmButton({ children, onConfirm, className='btn btn-danger', confirmText='정말?' }) {
  const [armed, setArmed] = useState(false);
  useEffect(() => { if (!armed) return; const t = setTimeout(() => setArmed(false), 2500); return () => clearTimeout(t); }, [armed]);
  return (
    <button className={className} onClick={() => { if (armed) { onConfirm(); setArmed(false); } else setArmed(true); }}>
      {armed ? confirmText : children}
    </button>
  );
}

  );
}

  const [token, setToken] = useState(settings.apiToken);

  const [validating, setValidating] = useState(false);
  const [validMsg, setValidMsg] = useState('');

  const [maxRetry, setMaxRetry] = useState(settings.maxRetry);
  const [apiBase, setApiBase] = useState(settings.apiBase);

  const validate = async () => {
    setValidating(true); setValidMsg('');
    try {
      const r = await novelaiValidateToken(apiBase, token);
      if (r.ok) setValidMsg('✓ 토큰 유효');
      else setValidMsg(`✗ ${r.status} ${r.body || '검증 실패'}`.slice(0,180));
    } catch (e) {
      setValidMsg(`✗ ${String(e.message||e).slice(0,120)}`);
    } finally { setValidating(false); }

  const save = () => {
    const next = { ...settings, apiToken: token, delayBetweenJobsMs: Number(delay)||1500, maxRetry: Number(maxRetry)||0, apiBase };

    setSettings(next);

          <div className="flex gap-2">
            <input className="input flex-1 mono" type={reveal ? 'text' : 'password'} value={token} onChange={e=>setToken(e.target.value)} placeholder="pst-..." />
            <button className="btn" onClick={()=>setReveal(r=>!r)}>{reveal?'숨김':'표시'}</button>

          <div className="text-xs text-slate-400 mono">현재 저장됨: {maskToken(settings.apiToken) || '(없음)'} {validMsg && <span className="ml-2">{validMsg}</span>}</div>
        </Field>
        {isProxyMode() ? (
          <div className="text-xs text-slate-400">프록시 모드 · <span className="mono">{apiBase}</span> (자동 설정됨)</div>
        ) : (

            <input className="input mono" value={apiBase} onChange={e=>setApiBase(e.target.value)} />
          </Field>
        )}
        <div className="grid grid-cols-2 gap-4">
          <Field label="작업 사이 딜레이 (ms)"><input className="input" type="number" value={delay} onChange={e=>setDelay(e.target.value)} /></Field>
          <Field label="최대 재시도 횟수"><input className="input" type="number" value={maxRetry} onChange={e=>setMaxRetry(e.target.value)} /></Field>
        </div>
        <div className="flex gap-2">

        </div>
      </div>
    </div>
  );
}

function CharacterEditor({ initial, onCancel, onSave }) {
  const [draft, setDraft] = useState(initial || {
    name: '', basePrompt: '', negativePrompt: '', defaultSeedMode: 'random', fixedSeed: '', outputFolderName: '', tags: [], referenceImages: []
  });
  const upd = (patch) => setDraft(d => ({ ...d, ...patch }));
  const valid = draft.name.trim().length > 0;
  const submit = () => {
    if (!valid) return;
    const out = { ...draft };
    out.fixedSeed = out.fixedSeed === '' || out.fixedSeed == null ? undefined : Number(out.fixedSeed);
    out.outputFolderName = (out.outputFolderName || out.name).trim();
    out.referenceImages = (out.referenceImages || []).map(r => ({ ...r }));
    onSave(out);
  };

  const refs = draft.referenceImages || [];
  const addRefs = async () => {
    const files = await pickImageFiles(true);
    if (!files.length) return;
    const max = 6;
    const remaining = max - refs.length;
    if (remaining <= 0) { alert(`PR 이미지는 최대 ${max}장까지 추가할 수 있습니다.`); return; }
    const picked = files.slice(0, remaining).map(f => ({
      id: uid('ref'),
      blob: f,
      mimeType: f.type || 'image/png',
      filename: f.name,
      enabled: true,
      mode: 'character',
      strength: 0.6,
      fidelity: 1.0,
    }));
    setDraft(d => ({ ...d, referenceImages: [...(d.referenceImages||[]), ...picked] }));
  };
  const updRef = (id, patch) => setDraft(d => ({ ...d, referenceImages: (d.referenceImages||[]).map(r => r.id===id ? { ...r, ...patch } : r) }));
  const rmRef = (id) => setDraft(d => ({ ...d, referenceImages: (d.referenceImages||[]).filter(r => r.id !== id) }));
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={onCancel}>
      <div className="card p-5 w-full max-w-2xl space-y-3 max-h-[90vh] overflow-auto" onClick={e=>e.stopPropagation()}>
        <h3 className="text-lg font-semibold">{initial ? '캐릭터 편집' : '새 캐릭터'}</h3>
        <Field label="이름"><input className="input" value={draft.name} onChange={e=>upd({name:e.target.value})} /></Field>
        <Field label="저장 폴더명 (선택)"><input className="input mono" value={draft.outputFolderName} onChange={e=>upd({outputFolderName:e.target.value})} placeholder="비우면 이름을 사용" /></Field>
        <Field label="기본 프롬프트"><textarea className="input mono" value={draft.basePrompt} onChange={e=>upd({basePrompt:e.target.value})} /></Field>
        <Field label="네거티브 프롬프트 (선택)"><textarea className="input mono" value={draft.negativePrompt} onChange={e=>upd({negativePrompt:e.target.value})} /></Field>
        <div className="grid grid-cols-2 gap-3">
          <Field label="Seed 모드">
            <select className="input" value={draft.defaultSeedMode} onChange={e=>upd({defaultSeedMode:e.target.value})}>
              <option value="random">random (작업마다 랜덤)</option>
              <option value="fixed_per_character">fixed_per_character (캐릭터당 고정)</option>
              <option value="fixed_per_job">fixed_per_job (모든 작업 동일)</option>
            </select>
          </Field>
          <Field label="고정 seed (선택)"><input className="input mono" value={draft.fixedSeed??''} onChange={e=>upd({fixedSeed:e.target.value})} placeholder="비우면 자동" /></Field>
        </div>

        <div className="space-y-2 pt-2 border-t border-slate-800/60 mt-2">
          <div className="flex items-center justify-between">
            <div>
              <div className="text-sm font-medium">Precise Reference (PR) 이미지</div>
              <div className="text-xs text-slate-500">캐릭터 단위로 묶인 레퍼런스. 큐 실행 시 이 캐릭터의 모든 작업에 자동 적용됩니다 (최대 6장).</div>
            </div>
            <button className="btn" onClick={addRefs}>+ 이미지 추가</button>
          </div>
          {refs.length === 0 && <div className="text-xs text-slate-500 py-2">아직 레퍼런스 이미지가 없습니다.</div>}
          <div className="space-y-2">
            {refs.map(r => <RefImageRow key={r.id} r={r} onUpdate={(p)=>updRef(r.id,p)} onRemove={()=>rmRef(r.id)} />)}
          </div>
        </div>

        <div className="flex justify-end gap-2 pt-2">
          <button className="btn" onClick={onCancel}>취소</button>
          <button className="btn btn-primary" onClick={submit} disabled={!valid}>저장</button>
        </div>
      </div>
    </div>
  );
}

  return (
    <div className="card p-3 flex gap-3 items-start">
      {url ? <img src={url} alt={r.filename} className="w-24 h-24 object-cover rounded-lg border border-slate-700" /> : <div className="w-24 h-24 bg-slate-800 rounded-lg" />}
      <div className="flex-1 space-y-2 min-w-0">

          <label className="text-xs flex items-center gap-1 cursor-pointer select-none">
            <input type="checkbox" checked={r.enabled !== false} onChange={e=>onUpdate({enabled:e.target.checked})} />
            Enabled
          </label>

            <option value="character">Character</option>
            <option value="style">Style</option>
          </select>
          <span className="text-xs text-slate-500 truncate flex-1" title={r.filename}>{r.filename}</span>
          <button className="btn btn-ghost text-red-400 text-xs" onClick={onRemove}>삭제</button>
        </div>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <div className="flex items-center justify-between text-xs text-slate-300">
              <span>Strength</span><span className="mono">{Number(r.strength??0.6).toFixed(2)}</span>
            </div>
            <input type="range" min="0" max="1" step="0.05" value={r.strength??0.6} onChange={e=>onUpdate({strength:Number(e.target.value)})} className="w-full" />
          </div>
          <div>
            <div className="flex items-center justify-between text-xs text-slate-300">
              <span>Fidelity</span><span className="mono">{Number(r.fidelity??1.0).toFixed(2)}</span>
            </div>
            <input type="range" min="0" max="1" step="0.05" value={r.fidelity??1.0} onChange={e=>onUpdate({fidelity:Number(e.target.value)})} className="w-full" />
          </div>
        </div>
      </div>
    </div>
  );
}

              <div className="text-xs text-slate-400 line-clamp-2">{p.description}</div>
              <ul className="text-xs space-y-1 mt-1">
                {p.prompts.slice(0,8).map(s => (
                  <li key={s.id} className="flex items-center gap-2">
                    <span className={s.enabled ? 'text-slate-200' : 'text-slate-500 line-through'}>{pad(s.order, 2)} · {s.title}</span>
                  </li>
                ))}
                {p.prompts.length > 8 && <li className="text-slate-500">… +{p.prompts.length-8}개</li>}
              </ul>
            </div>
          );
        })}
        {promptSets.length === 0 && <div className="text-slate-500 col-span-full">프롬프트 세트가 없습니다.</div>}
      </div>
      {editing && <PromptSetEditor key={isNew?'new':editing.id} initial={isNew?null:editing} onCancel={()=>setEditing(null)} onSave={save} />}
    </div>
  );
}

function PromptSetEditor({ initial, onCancel, onSave }) {
  const [draft, setDraft] = useState(initial || { name: '', description: '', prompts: [] });
  const upd = (patch) => setDraft(d => ({ ...d, ...patch }));
  const reorder = () => setDraft(d => ({ ...d, prompts: d.prompts.map((s,i)=>({ ...s, order: i+1 })) }));
  const addSlot = () => setDraft(d => ({ ...d, prompts: [...d.prompts, { id: uid('slot'), order: d.prompts.length+1, title: `slot_${d.prompts.length+1}`, prompt: '', enabled: true }] }));
  const updateSlot = (id, patch) => setDraft(d => ({ ...d, prompts: d.prompts.map(s => s.id===id ? { ...s, ...patch } : s) }));
  const removeSlot = (id) => setDraft(d => ({ ...d, prompts: d.prompts.filter(s=>s.id!==id) }));
  const move = (id, dir) => setDraft(d => {
    const idx = d.prompts.findIndex(s=>s.id===id);
    if (idx<0) return d;
    const j = idx + dir;
    if (j<0 || j>=d.prompts.length) return d;
    const arr = [...d.prompts];
    [arr[idx], arr[j]] = [arr[j], arr[idx]];
    return { ...d, prompts: arr.map((s,i)=>({ ...s, order: i+1 })) };
  });

  useEffect(reorder, []); // initial normalize

  const valid = draft.name.trim().length > 0;
  return (
    <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={onCancel}>
      <div className="card p-5 w-full max-w-4xl space-y-3 max-h-[90vh] overflow-auto" onClick={e=>e.stopPropagation()}>
        <h3 className="text-lg font-semibold">{initial?'프롬프트 세트 편집':'새 프롬프트 세트'}</h3>
        <div className="grid grid-cols-2 gap-3">
          <Field label="이름"><input className="input" value={draft.name} onChange={e=>upd({name:e.target.value})} /></Field>
          <Field label="설명"><input className="input" value={draft.description||''} onChange={e=>upd({description:e.target.value})} /></Field>
        </div>
        <div className="flex items-center justify-between">
          <div className="text-sm text-slate-300">슬롯 ({draft.prompts.length})</div>
          <button className="btn" onClick={addSlot}>+ 슬롯 추가</button>
        </div>
        <div className="space-y-2">
          {draft.prompts.map((s, i) => (
            <div key={s.id} className="card p-3 space-y-2">
              <div className="flex items-center gap-2">
                <span className="mono text-xs text-slate-400 w-8">{pad(i+1,2)}</span>
                <input className="input flex-1" value={s.title} onChange={e=>updateSlot(s.id,{title:e.target.value})} placeholder="제목 (파일명에 사용)" />
                <label className="text-xs flex items-center gap-1"><input type="checkbox" checked={s.enabled} onChange={e=>updateSlot(s.id,{enabled:e.target.checked})} /> 활성</label>
                <button className="btn btn-ghost" onClick={()=>move(s.id,-1)}>↑</button>
                <button className="btn btn-ghost" onClick={()=>move(s.id,+1)}>↓</button>
                <button className="btn btn-ghost text-red-400" onClick={()=>removeSlot(s.id)}>×</button>
              </div>
              <textarea className="input mono" value={s.prompt} onChange={e=>updateSlot(s.id,{prompt:e.target.value})} placeholder="프롬프트" />
              <textarea className="input mono" value={s.negativePrompt||''} onChange={e=>updateSlot(s.id,{negativePrompt:e.target.value})} placeholder="(선택) 슬롯별 네거티브 — 비우면 캐릭터/기본값 사용" />
              <div className="flex items-center gap-2 text-xs text-slate-400">
                <span>해상도 오버라이드:</span>
                <input className="input mono w-24" type="number" min="0" step="64" placeholder="width" value={s.width||''} onChange={e=>updateSlot(s.id,{width: e.target.value?Number(e.target.value):undefined})} />
                <span>×</span>
                <input className="input mono w-24" type="number" min="0" step="64" placeholder="height" value={s.height||''} onChange={e=>updateSlot(s.id,{height: e.target.value?Number(e.target.value):undefined})} />
                <span className="text-slate-500">(비우면 프리셋 해상도 사용)</span>
              </div>
            </div>
          ))}
          {draft.prompts.length === 0 && <div className="text-slate-500 text-sm">슬롯이 없습니다.</div>}
        </div>
        <div className="flex justify-end gap-2 pt-2">
          <button className="btn" onClick={onCancel}>취소</button>
          <button className="btn btn-primary" onClick={()=>onSave(draft)} disabled={!valid}>저장</button>
        </div>
      </div>
    </div>
  );
}

function BatchRunPage({ characters, promptSets, settings }) {
  const r = useStore(runner);
  const [selectedChars, setSelectedChars] = useState([]);
  const [promptSetId, setPromptSetId] = useState(promptSets[0]?.id || '');
  const [sessionName, setSessionName] = useState('');
  const [preset, setPreset] = useState(() => {
    try { return JSON.parse(localStorage.getItem('nai-preset')) || DEFAULT_PRESET; } catch { return DEFAULT_PRESET; }
  });
  const [batch, setBatch] = useState(() => {
    try { return { ...DEFAULT_BATCH, ...JSON.parse(localStorage.getItem('nai-batch') || '{}') }; } catch { return { ...DEFAULT_BATCH }; }
  });
  const [queue, setQueue] = useState([]); // current preview / running jobs
  const [sessionObj, setSessionObj] = useState(null);
  const [error, setError] = useState('');

  useEffect(() => { localStorage.setItem('nai-preset', JSON.stringify(preset)); }, [preset]);
  useEffect(() => { localStorage.setItem('nai-batch', JSON.stringify(batch)); }, [batch]);
  useEffect(() => { if (!promptSetId && promptSets[0]) setPromptSetId(promptSets[0].id); }, [promptSets]);

  const promptSet = promptSets.find(p => p.id === promptSetId);
  const selectedCharObjs = useMemo(() => characters.filter(c => selectedChars.includes(c.id)), [characters, selectedChars]);
  const enabledSlotCount = promptSet ? promptSet.prompts.filter(s => s.enabled).length : 0;
  const expectedJobs = selectedCharObjs.length * enabledSlotCount;

  // live job updates while running
  useEffect(() => {
    if (!r.sessionId) return;
    let alive = true;
    const tick = async () => {
      const list = await db.jobsBySession(r.sessionId);
      if (alive) setQueue(list.sort((a,b)=>a.order-b.order));
    };
    tick();
    const iv = setInterval(tick, r.isRunning ? 700 : 2500);
    return () => { alive = false; clearInterval(iv); };
  }, [r.sessionId, r.isRunning]);

  const toggleChar = (id) => setSelectedChars(prev => prev.includes(id) ? prev.filter(x=>x!==id) : [...prev, id]);

  const createQueue = async () => {
    setError('');
    if (!settings.apiToken) return setError('API 토큰이 설정되지 않았습니다.');
    if (!selectedCharObjs.length) return setError('캐릭터를 1명 이상 선택하세요.');
    if (!promptSet) return setError('프롬프트 세트를 선택하세요.');
    if (!enabledSlotCount) return setError('활성화된 프롬프트 슬롯이 없습니다.');

    const sid = uid('sess');
    const session = {
      id: sid,
      name: sessionName.trim() || promptSet.name,
      startedAt: nowIso(),
      completedAt: null,
      preset,
      batch,
      characterIds: selectedCharObjs.map(c=>c.id),
      promptSetId: promptSet.id,
    };
    const jobs = buildQueue({ characters: selectedCharObjs, promptSet, sessionId: sid, batch, preset });
    await db.put('sessions', session);
    await db.bulkPut('jobs', jobs);
    setSessionObj(session);
    setQueue(jobs);
    runner.set(s => ({ ...s, sessionId: sid }));
  };

  const start = async () => {
    setError('');
    const jobs = (await db.jobsBySession(sessionObj?.id || runner.get().sessionId)).sort((a,b)=>a.order-b.order);
    if (!jobs.length) return setError('큐가 비었습니다.');
    const session = sessionObj || await db.get('sessions', runner.get().sessionId);
    startRun({ session, jobs, preset: session.preset, settings }).catch(e => { rlog('error', String(e.message||e)); });
  };

  const pause = () => runner.set(s => ({ ...s, isPaused: true }));
  const resume = () => runner.set(s => ({ ...s, isPaused: false }));
  const stop = () => runner.set(s => ({ ...s, isCancelling: true, isPaused: false }));
  const retryFailed = async () => {
    if (!runner.get().sessionId) return;
    const jobs = await db.jobsBySession(runner.get().sessionId);
    const failed = jobs.filter(j => j.status === 'failed');
    if (!failed.length) return;
    for (const j of failed) {
      await db.put('jobs', { ...j, status: 'pending', retryCount: 0, errorMessage: undefined, completedAt: undefined });
    }
    const session = await db.get('sessions', runner.get().sessionId);
    const fresh = (await db.jobsBySession(session.id)).sort((a,b)=>a.order-b.order);
    startRun({ session, jobs: fresh, preset: session.preset, settings }).catch(e => { rlog('error', String(e.message||e)); });
  };

  const progress = useMemo(() => {
    const total = queue.length;
    const done = queue.filter(j => ['success','failed','skipped','cancelled'].includes(j.status)).length;
    return { total, done, pct: total ? Math.round(done/total*100) : 0 };
  }, [queue]);

  return (
    <div className="space-y-4">
      <h2 className="text-xl font-semibold">배치 실행</h2>

      {error && <div className="card p-3 border-red-500/40 text-red-300 text-sm">{error}</div>}

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <div className="card p-4 space-y-3">
          <div className="font-semibold">캐릭터 선택 <span className="text-xs text-slate-400">({selectedChars.length}/{characters.length})</span></div>
          <div className="flex gap-2 text-xs">
            <button className="btn btn-ghost" onClick={()=>setSelectedChars(characters.map(c=>c.id))}>전체</button>
            <button className="btn btn-ghost" onClick={()=>setSelectedChars([])}>해제</button>
          </div>
          <div className="max-h-72 overflow-auto space-y-1">
            {characters.map(c => (
              <label key={c.id} className={`flex items-center gap-2 p-2 rounded-lg cursor-pointer ${selectedChars.includes(c.id)?'bg-blue-900/30':'hover:bg-slate-800/40'}`}>
                <input type="checkbox" checked={selectedChars.includes(c.id)} onChange={()=>toggleChar(c.id)} />
                <span className="flex-1 truncate">{c.name}</span>
                {(c.referenceImages?.filter(r=>r.enabled!==false).length || 0) > 0 && <span className="badge badge-running">PR {c.referenceImages.filter(r=>r.enabled!==false).length}</span>}
                <span className="text-xs text-slate-500 mono truncate max-w-[40%]">{c.basePrompt?.slice(0,60)}</span>
              </label>
            ))}
            {characters.length === 0 && <div className="text-slate-500 text-sm p-2">캐릭터를 먼저 추가하세요.</div>}
          </div>
        </div>
        <div className="card p-4 space-y-3">
          <div className="font-semibold">프롬프트 세트</div>
          <select className="input" value={promptSetId} onChange={e=>setPromptSetId(e.target.value)}>
            <option value="">선택 안 함</option>
            {promptSets.map(p => <option key={p.id} value={p.id}>{p.name} ({p.prompts.filter(s=>s.enabled).length}/{p.prompts.length})</option>)}
          </select>
          {promptSet && (
            <ul className="text-sm max-h-56 overflow-auto space-y-1">
              {promptSet.prompts.map(s => (
                <li key={s.id} className={`flex items-center gap-2 ${s.enabled?'':'text-slate-500 line-through'}`}>
                  <span className="mono text-xs text-slate-400 w-8">{pad(s.order,2)}</span>
                  <span className="truncate flex-1">{s.title}</span>
                  <span className="text-xs text-slate-500 mono truncate max-w-[50%]">{s.prompt.slice(0,80)}</span>
                </li>
              ))}
            </ul>
          )}
          <Field label="세션 이름 (선택)"><input className="input" value={sessionName} onChange={e=>setSessionName(e.target.value)} placeholder="비우면 프롬프트 세트 이름 사용" /></Field>
        </div>
      </div>

      <BatchPromptCard batch={batch} setBatch={setBatch} preset={preset} />

      <div className="card p-4 space-y-3">
        <div className="font-semibold">생성 프리셋</div>
        <PresetForm preset={preset} onChange={setPreset} />
      </div>

      <div className="card p-4 space-y-3">
        <div className="flex items-center justify-between flex-wrap gap-2">
          <div className="font-semibold">
            큐 ({queue.length || expectedJobs} jobs)
            {queue.length > 0 && <span className="text-xs text-slate-400 ml-2">진행 {progress.done}/{progress.total} · {progress.pct}%</span>}
          </div>
          <div className="flex gap-2 flex-wrap">
            <button className="btn" disabled={r.isRunning} onClick={createQueue}>큐 생성</button>
            <button className="btn btn-primary" disabled={r.isRunning || !queue.length} onClick={start}>실행</button>
            {!r.isPaused
              ? <button className="btn" disabled={!r.isRunning} onClick={pause}>일시정지</button>
              : <button className="btn" disabled={!r.isRunning} onClick={resume}>재개</button>}
            <button className="btn btn-danger" disabled={!r.isRunning} onClick={stop}>중단</button>
            <button className="btn" disabled={r.isRunning || !queue.some(j=>j.status==='failed')} onClick={retryFailed}>실패 재시도</button>
          </div>
        </div>
        {r.isRunning && r.current && (
          <div className="text-sm text-slate-300">
            진행 중: <span className="mono">#{pad(r.current.index)}/{r.current.total}</span> · {r.current.characterName} / {r.current.promptTitle}
            {r.isPaused && <span className="badge badge-pending ml-2">일시정지</span>}
            {r.isCancelling && <span className="badge badge-cancelled ml-2">중단 중</span>}
          </div>
        )}
        <div className="w-full bg-slate-800/60 rounded-full h-2 overflow-hidden">
          <div className="bg-blue-500 h-2 transition-all" style={{ width: `${progress.pct}%` }} />
        </div>
        <QueueTable jobs={queue} />
      </div>

      <RunnerLogs />
    </div>
  );
}

function JobImage({ jobId, size = 64 }) {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let active = true;
    let created = null;
    (async () => {
      const blob = await getImageBlob(jobId);
      if (!active || !blob) return;
      created = URL.createObjectURL(blob);
      setUrl(created);
    })();
    return () => { active = false; if (created) URL.revokeObjectURL(created); };
  }, [jobId]);
  if (!url) return <div className="text-slate-600 text-xs">—</div>;
  return (
    <a href={url} target="_blank" rel="noreferrer" title="새 탭에서 원본 열기">
      <img src={url} alt="" style={{width: size, height: size, objectFit: 'cover'}} className="rounded border border-slate-700" />
    </a>
  );
}

function QueueTable({ jobs }) {

  return (
    <div className="overflow-auto max-h-[600px]">
      <table className="w-full text-sm">
        <thead className="text-xs text-slate-400 sticky top-0 bg-[#131826]">
          <tr><th className="text-left p-2">#</th><th className="text-left p-2">미리보기</th><th className="text-left p-2">캐릭터</th><th className="text-left p-2">프롬프트</th><th className="text-left p-2">상태</th><th className="text-left p-2">seed</th><th className="text-left p-2">재시도</th><th className="text-left p-2">오류</th></tr>
        </thead>
        <tbody>
          {jobs.map(j => (
            <tr key={j.id} className="row-hover border-t border-slate-800/60">
              <td className="p-2 mono align-middle">{pad(j.order)}</td>
              <td className="p-2 align-middle">{j.status === 'success' ? <JobImage jobId={j.id} /> : <div className="w-16 h-16 rounded border border-dashed border-slate-700" />}</td>
              <td className="p-2 align-middle">{j.characterName}</td>
              <td className="p-2 truncate max-w-[200px] align-middle">{j.promptTitle}</td>
              <td className="p-2 align-middle"><Badge status={j.status} /></td>
              <td className="p-2 mono text-xs align-middle">{j.seed ?? '-'}</td>
              <td className="p-2 mono text-xs align-middle">{j.retryCount || 0}</td>
              <td className="p-2 text-xs truncate max-w-[280px] align-middle" title={j.errorMessage}>{j.errorMessage ? <span className="text-red-400">{j.errorMessage}</span> : ''}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function RunnerLogs() {
  const r = useStore(runner);
  if (!r.logs.length) return null;
  return (
    <div className="card p-3">
      <div className="text-sm text-slate-300 mb-2">로그</div>
      <div className="max-h-48 overflow-auto mono text-xs space-y-1">
        {r.logs.slice(-200).map((l,i) => (
          <div key={i} className={l.level==='error'?'text-red-400':l.level==='warn'?'text-amber-300':'text-slate-300'}>
            <span className="text-slate-500 mr-2">{l.ts.slice(11,19)}</span><span className="uppercase mr-2">{l.level}</span>{l.msg}
          </div>
        ))}
      </div>
    </div>
  );
}

function SessionsPage({ characters, promptSets }) {
  const [sessions, setSessions] = useState([]);
  const [openId, setOpenId] = useState(null);
  const [jobs, setJobs] = useState([]);

  const reload = async () => {
    const ss = await db.getAll('sessions');
    setSessions(ss.sort((a,b)=> (b.startedAt||'').localeCompare(a.startedAt||'')));
  };
  useEffect(() => { reload(); }, []);
  useEffect(() => {
    if (!openId) { setJobs([]); return; }
    db.jobsBySession(openId).then(js => setJobs(js.sort((a,b)=>a.order-b.order)));
  }, [openId]);

  const del = async (id) => {
    await db.delete('sessions', id);
    const jobs = await db.jobsBySession(id);
    for (const j of jobs) await db.delete('jobs', j.id);
    await deleteImagesBySession(id);
    if (openId === id) setOpenId(null);
    reload();
  };

  return (
    <div className="space-y-4">
      <h2 className="text-xl font-semibold">세션 기록</h2>
      <div className="card divide-y divide-slate-800/60">
        {sessions.map(s => (
          <div key={s.id} className="p-3">
            <div className="flex items-center gap-3 cursor-pointer" onClick={()=>setOpenId(openId===s.id?null:s.id)}>
              <div className="flex-1">
                <div className="font-medium">{s.name}</div>
                <div className="text-xs text-slate-400 mono">{fmtDate(s.startedAt)} · 캐릭터 {s.characterIds.length} · 프리셋 {s.preset?.model}</div>
              </div>
              <div className="text-xs text-slate-400">{s.completedAt ? '완료' : '진행 중'}</div>
              <ConfirmButton className="btn btn-ghost text-red-400" confirmText="삭제 확인" onConfirm={()=>del(s.id)}>삭제</ConfirmButton>
            </div>
            {openId === s.id && (
              <div className="mt-3"><QueueTable jobs={jobs} /></div>
            )}
          </div>
        ))}
        {sessions.length === 0 && <div className="p-4 text-slate-500 text-sm">세션이 없습니다.</div>}
      </div>
    </div>
  );
}

function DashboardPage({ characters, promptSets }) {
  const [sessions, setSessions] = useState([]);
  useEffect(() => { db.getAll('sessions').then(s => setSessions(s.sort((a,b)=>(b.startedAt||'').localeCompare(a.startedAt||'')))); }, []);
  const recent = sessions.slice(0,5);
  return (
    <div className="space-y-4">
      <h2 className="text-xl font-semibold">대시보드</h2>
      <div className="grid grid-cols-3 gap-3">
        <Stat label="캐릭터" value={characters.length} />
        <Stat label="프롬프트 세트" value={promptSets.length} />
        <Stat label="세션" value={sessions.length} />
      </div>
      <div className="card p-4">
        <div className="font-semibold mb-2">최근 세션</div>
        {recent.length === 0 && <div className="text-slate-500 text-sm">아직 실행 기록이 없습니다.</div>}
        <ul className="divide-y divide-slate-800/60">
          {recent.map(s => (
            <li key={s.id} className="py-2 text-sm flex items-center gap-3">
              <span className="flex-1">{s.name}</span>
              <span className="text-xs text-slate-400 mono">{fmtDate(s.startedAt)}</span>
              <span className="text-xs">{s.completedAt ? '완료' : '진행 중'}</span>
            </li>
          ))}
        </ul>
      </div>
      <div className="card p-4 text-sm text-slate-300 leading-relaxed">
        <div className="font-semibold mb-2">사용 흐름</div>
        <ol className="list-decimal pl-5 space-y-1">
          <li>설정에서 NovelAI 토큰을 입력하고 출력 폴더를 선택합니다.</li>
          <li>캐릭터를 등록하고 각자의 basePrompt 를 설정합니다.</li>
          <li>프롬프트 세트를 만들어 슬롯들을 등록합니다 (예: 기본 8장 세트).</li>
          <li>배치 실행에서 캐릭터들과 세트를 선택 → 큐 생성 → 실행 합니다.</li>
          <li>이미지는 <span className="mono">출력폴더/{`{날짜_세션명}`}/{`{캐릭터명}`}/{`{순번_제목_seed}.png`}</span> 형식으로 저장됩니다.</li>
        </ol>
      </div>
    </div>
  );
}
function Stat({ label, value }) {
  return <div className="card p-4"><div className="text-xs text-slate-400">{label}</div><div className="text-2xl font-semibold mt-1">{value}</div></div>;
}

/* ============ App Shell ============ */
const PAGES = [
  { id: 'dashboard', label: '대시보드' },
  { id: 'characters', label: '캐릭터' },
  { id: 'prompts', label: '프롬프트 세트' },
  { id: 'batch', label: '배치 실행' },
  { id: 'sessions', label: '세션 기록' },
  { id: 'settings', label: '설정' },
];

function App() {
  const [page, setPage] = useState('dashboard');
  const [settings, setSettings] = useState(loadSettings());
  const [characters, setCharacters] = useState([]);
  const [promptSets, setPromptSets] = useState([]);

  const reloadChars = useCallback(() => db.getAll('characters').then(setCharacters), []);
  const reloadSets = useCallback(() => db.getAll('promptSets').then(setPromptSets), []);

  useEffect(() => { reloadChars(); reloadSets(); }, [reloadChars, reloadSets]);

  // seed with example data on first run
  useEffect(() => {
    (async () => {
      const seeded = await kvGet('seeded', false);
      if (seeded) return;
      const chars = await db.getAll('characters');
      const sets = await db.getAll('promptSets');
      if (chars.length === 0 && sets.length === 0) {
        const now = nowIso();
        await db.put('characters', {
          id: uid('char'), name: '남궁현아',
          basePrompt: 'black hair, elegant wuxia swordswoman, blue-white hanfu, calm expression',
          negativePrompt: 'bad anatomy, low quality, extra fingers',
          defaultSeedMode: 'random', outputFolderName: '남궁현아',
          createdAt: now, updatedAt: now, tags: [],
        });
        const slots = [
          ['standing_full_body', 'standing, full body, looking at viewer'],
          ['portrait', 'close-up portrait, soft smile'],
          ['battle_stance', 'battle stance, sword drawn'],
          ['sitting', 'sitting on wooden chair'],
          ['walking', 'walking through old street'],
          ['back_view', 'back view, wind blowing hair'],
          ['dramatic', 'dramatic lighting, serious expression'],
          ['cover', 'poster composition, cinematic framing'],
        ];
        await db.put('promptSets', {
          id: uid('pset'), name: '기본 8장 세트', description: '설계 문서 예시 세트',
          prompts: slots.map(([title, prompt], i) => ({ id: uid('slot'), order: i+1, title, prompt, enabled: true })),
          createdAt: now, updatedAt: now,
        });
        await kvSet('seeded', true);
        reloadChars(); reloadSets();
      } else {
        await kvSet('seeded', true);
      }
    })();
  }, [reloadChars, reloadSets]);

  const r = useStore(runner);

  useEffect(() => {
    if (!settings.apiToken) return;
    let cancelled = false;
    const refresh = async () => {
      try {
        const a = await novelaiGetSubscription(settings.apiBase, settings.apiToken);
        if (!cancelled) runner.set(s => ({ ...s, anlas: { ...s.anlas, balance: a.total } }));
      } catch {}
    };
    refresh();
    const t = setInterval(refresh, 60000);
    return () => { cancelled = true; clearInterval(t); };
  }, [settings.apiToken, settings.apiBase]);

  const anlasConsumed = (r.anlas?.sessionStart != null && r.anlas?.balance != null)
    ? Math.max(0, r.anlas.sessionStart - r.anlas.balance) : 0;

  return (
    <div className="h-full flex">
      <aside className="w-64 shrink-0 border-r border-slate-800/60 p-3 flex flex-col gap-1">
        <div className="px-2 py-3">
          <div className="text-base font-semibold">NAI Batch Runner</div>
          <div className="text-xs text-slate-400">캐릭터 × 프롬프트 자동 순회</div>
        </div>
        {PAGES.map(p => (
          <div key={p.id} className={`nav-item ${page===p.id?'active':''}`} onClick={()=>setPage(p.id)}>
            <span>{p.label}</span>
          </div>
        ))}
        <div className="mt-auto p-2 text-xs text-slate-500 space-y-1">
          <div>토큰: <span className="mono">{maskToken(settings.apiToken)||'(없음)'}</span></div>
          <div>
            Anlas: <span className="mono text-slate-300">{r.anlas?.balance != null ? r.anlas.balance.toLocaleString() : '—'}</span>
            {anlasConsumed > 0 && <span className="ml-1 text-amber-300">(이번 세션 -{anlasConsumed.toLocaleString()})</span>}
          </div>
          <div>실행: <span className={r.isRunning?'text-emerald-400':'text-slate-400'}>{r.isRunning?(r.isPaused?'paused':'running'):'idle'}</span></div>
        </div>
      </aside>
      <main className="flex-1 overflow-auto p-6">
        {page === 'dashboard' && <DashboardPage characters={characters} promptSets={promptSets} />}
        {page === 'characters' && <CharactersPage characters={characters} reload={reloadChars} />}
        {page === 'prompts' && <PromptSetsPage promptSets={promptSets} reload={reloadSets} />}
        {page === 'batch' && <BatchRunPage characters={characters} promptSets={promptSets} settings={settings} />}
        {page === 'sessions' && <SessionsPage characters={characters} promptSets={promptSets} />}
        {page === 'settings' && <SettingsPage settings={settings} setSettings={setSettings} />}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
